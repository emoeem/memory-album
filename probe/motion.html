<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>motion probe</title>
    <style>
      body { margin: 0; background: #0a1526; color: #fff; font: 14px/1.5 sans-serif; padding: 20px; }
      .box { width: 200px; height: 60px; margin: 12px 0; background: #1c3350; }
      .rot { transform: rotate(5deg); }
    </style>
  </head>
  <body>
    <div class="box" id="a">A: 位移/缩放/虚化</div>
    <div class="box rot" id="b">B: CSS 有 rotate，只动 y/scale</div>
    <div class="box rot" id="c">C: CSS 有 rotate，也写 rotate</div>
    <div class="box rot" id="d">D: CSS 有 rotate，只动 filter</div>
    <div class="box" id="e">E: 首帧有没有闪</div>
    <script type="module" src="./motion.js"></script>
  </body>
</html>
